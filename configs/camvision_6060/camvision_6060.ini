# CamVision 6060 iCam SPM — LinuxCNC machine config.
# Machine parameters preserved verbatim from the working legacy
# 6060_iCam_SPM config; the CamVision GUI is launched alongside AXIS via the
# [APPLICATIONS] section below (no manual start step).

[EMC]
MACHINE = camvision_6060
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
GRIDS = 10mm 20mm 50mm 100mm
MAX_FEED_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 10.00
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 100.00
CYCLE_TIME = 0.100
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 3
PROGRAM_PREFIX = Gcodes
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm

# Launch the CamVision GUI beside the AXIS GUI once the GUI is up.
[APPLICATIONS]
DELAY = 3
APP = ./launch_camvision.sh

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[FILTER]
PROGRAM_EXTENSION = .nc,.tap G-Code File

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = macros
USER_M_PATH = macros
INI_VARS = 1
HAL_PIN_VARS = 1

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 25000
SERVO_PERIOD = 1000000

[HAL]
HALFILE = camvision_6060.hal
HALUI = halui

[HALUI]
MDI_COMMAND = G28
MDI_COMMAND = G10 L20 P0 X0 Y0
MDI_COMMAND = G0 X0 Y0

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10.00
MAX_LINEAR_VELOCITY = 100.00

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

#*** AXIS_X *******************************
[AXIS_X]
MAX_VELOCITY = 95.0
MAX_ACCELERATION = 750.0
MIN_LIMIT = -0.001
MAX_LIMIT = 515.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -0.001
MAX_LIMIT = 515.0
MAX_VELOCITY = 95.0
MAX_ACCELERATION = 750.0
STEPGEN_MAXACCEL = 937.5
SCALE = 400.0
FERROR = 1
MIN_FERROR = .25
HOME_OFFSET = 0.000000
HOME_SEARCH_VEL = 30.000000
HOME_LATCH_VEL = 1.250000
HOME_SEQUENCE = 1

#*** AXIS_Y *******************************
[AXIS_Y]
